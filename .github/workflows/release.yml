# Builds the Flatpak from main and publishes it as a GitHub release, named after the
# latest version tag plus a timestamp: v0.0.1 becomes v0.0.1-20261105-143022 (UTC).
name: Release Flatpak

on:
  workflow_dispatch:

# Each job is granted only what it needs below.
permissions: {}

# One release at a time. A second run waits for the first to finish.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Runs first, so a bad tag or version fails in seconds rather than after a full build.
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Tags are needed to find the latest version.
          persist-credentials: false

      - name: Choose the release tag
        id: tag
        shell: bash
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Releases can only be built from main, not $GITHUB_REF."
            exit 1
          fi

          # The exclude skips earlier timestamped tags, which contain a hyphen. Without
          # it, the second run would produce v0.0.1-<timestamp>-<timestamp>.
          if ! base=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-*' 2>/dev/null); then
            echo "::error::No version tag found. Create one first, for example: git tag -s v0.0.1 -m 'Equalizer 0.0.1'"
            exit 1
          fi
          if ! [[ "$base" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Latest tag $base doesn't look like vX.Y.Z."
            exit 1
          fi

          # About shows the Cargo.toml version, so the release name has to agree with it.
          cargo_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "$base" != "v$cargo_version" ]; then
            echo "::error::Latest tag is $base, but Cargo.toml says $cargo_version. Update one so they match."
            exit 1
          fi

          tag="$base-$(date -u +%Y%m%d-%H%M%S)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Release tag: $tag"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    container:
      # The gnome-51 image. Update this along with runtime-version in the manifest.
      image: ghcr.io/flathub-infra/flatpak-github-actions@sha256:78d969b18225ae107ca29497bf09c4a3f791e5f1838a9a912a529d0024fb6210
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          manifest-path: io.github.zoeruda.Equalizer.yml
          bundle: Equalizer.flatpak
          artifact-name: flatpak-bundle
          # Every release is a clean build that inherits nothing from earlier runs.
          cache: false

      - name: Record the runtimes used
        shell: bash
        run: flatpak list --runtime --columns=application,branch,version,active

      # The bundled filter-chain module must match the runtime's libpipewire, and the
      # runtime here is always Flathub's newest, so the two could drift apart unnoticed.
      - name: Check the PipeWire versions match
        shell: bash
        run: |
          manifest=io.github.zoeruda.Equalizer.yml
          bundled=$(sed -n 's|.*/pipewire-\([0-9.]*\)\.tar\.gz|\1|p' "$manifest")
          runtime=$(sed -n "s/^runtime-version: '\(.*\)'/\1/p" "$manifest")
          sdk=$(flatpak info --show-location "org.gnome.Sdk//$runtime")
          pc=$(find "$sdk/files/lib" -maxdepth 3 -name libpipewire-0.3.pc | head -n 1)
          actual=$(sed -n 's/^Version: *//p' "$pc")
          if [ -z "$bundled" ] || [ "$bundled" != "$actual" ]; then
            echo "::error::The manifest bundles PipeWire '$bundled', but GNOME $runtime has '$actual'. Update the manifest to match."
            exit 1
          fi
          echo "PipeWire $actual matches."

  # The only job that can write to the repo. It runs no project code.
  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # To create the tag and release.
      id-token: write # To sign the attestation.
      attestations: write # To store the attestation.
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: flatpak-bundle
          path: dist

      - name: Name the bundle and create its checksum
        shell: bash
        run: |
          cd dist
          mv Equalizer.flatpak "Equalizer-$TAG-x86_64.flatpak"
          sha256sum "Equalizer-$TAG-x86_64.flatpak" > "Equalizer-$TAG-x86_64.flatpak.sha256"
          cat ./*.sha256

      - name: Attest where the bundle came from
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.flatpak

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          file="Equalizer-$TAG-x86_64.flatpak"
          cat > notes.md <<EOF
          Built from commit $GITHUB_SHA by [this workflow run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID).

          ## Install

          ~~~
          flatpak install --user ./$file
          ~~~

          This bundle is for x86_64 only. It gets the GNOME runtime from Flathub, and it doesn't update automatically.

          ## Verify

          ~~~
          sha256sum -c $file.sha256
          gh attestation verify $file --repo $GITHUB_REPOSITORY
          ~~~
          EOF

          gh release create "$TAG" \
            "dist/$file" \
            "dist/$file.sha256" \
            --target "$GITHUB_SHA" \
            --title "Equalizer $TAG" \
            --notes-file notes.md \
            --generate-notes \
            --latest
